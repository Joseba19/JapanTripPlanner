<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1014" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/shippori-mincho-600.woff2" as="font" type="font/woff2" crossorigin />
    <title>旅 · Japón '27</title>
    <script>
      // Tema antes del primer pintado (sin parpadeo). Preferencia: "dark" (por defecto), "light" o "system".
      ;(function () {
        var pref = 'dark'
        try {
          pref = JSON.parse(localStorage.getItem('jtp.theme')) || 'dark'
        } catch (e) {}
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').content = light ? '#f3eee3' : '#0f1014'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
